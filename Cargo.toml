# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-authorize-policy"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-authorize-policy"
description = "Authorization by a policy document in the estate's own TOML: statements that permit or deny by who, what and where, deny winning, an unknown key refused at load. A xmip-core-authorize technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The facts it judges are context's and the layer it
# answers for is core's.
authorize = { package = "xmip-core-authorize", git = "https://github.com/IlleNilsson/xmip-core-authorize", branch = "main" }
context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main" }
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }

# The document is TOML and its shape is a serde one, as everywhere in the
# estate; deny_unknown_fields is what refuses a key nobody reads.
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
